<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Certificate Verification | Sun Shine Club
    </title>

    <link
        rel="stylesheet"
        href="css/verify.css"
    />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>


<body>

    <div class="verify-shell">

        <div class="verify-card">

            <!-- =========================
                 SEARCH SECTION
            ========================== -->

            <div
                id="searchSection"
                class="search-section"
            >

                <img
                    src="https://pub-0ea4b0b9de9b4d6db5c369669418e7ef.r2.dev/logo/sun-shine-club-logo.png"
                    class="club-logo"
                    alt="Sun Shine Club"
                />

                <h1>
                    Sun Shine Club
                </h1>

                <h2>
                    Certificate Verification
                </h2>

                <p>
                    Enter the certificate ID below to verify
                    the issued certificate.
                </p>


                <div class="search-form">

                    <input
                        type="text"
                        id="certificateId"
                        placeholder="Enter Certificate ID (e.g. SSC-CERT-2026-001)"
                        autocomplete="off"
                    />

                    <button
                        id="verifyBtn"
                        type="button"
                    >

                        <i class="fa-solid fa-circle-check"></i>

                        Verify Certificate

                    </button>

                </div>


                <div class="scan-note">

                    <i class="fa-solid fa-qrcode"></i>

                    <span>
                        Use the certificate ID to verify
                        the document instantly.
                    </span>

                </div>

            </div>


            <!-- =========================
                 RESULT SECTION
            ========================== -->

            <div
                id="resultSection"
                class="result-section"
                style="display: none;"
            ></div>

        </div>

    </div>


    <!-- ==================================================
         FLOATING SHARE BUTTON

         IMPORTANT:
         This is OUTSIDE .verify-card.
         Do not move it into resultSection.
    =================================================== -->

    <button
        type="button"
        id="floatingShareBtn"
        class="floating-share-btn"
        aria-label="Share Certificate"
        title="Share Certificate"
    >

        <i class="fa-solid fa-share-nodes"></i>

    </button>


    <!-- =========================
         SHARE TOOLTIP
    ========================== -->

    <div
        id="shareTooltip"
        class="share-tooltip"
    ></div>


    <div class="visitor-counter">
        <i class="fa-solid fa-eye"></i>
        <span>Visitors</span>
        <strong id="visitorCount">...</strong>
    </div>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="js/verify.js"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js"></script>
    <script src="../js/visitor-count.js"></script>

</body>

</html>
