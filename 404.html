<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Sun Shine Club</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/logo/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #4e4ea1;

      padding: 20px;

      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: rgba(0, 21, 86, 0.712);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(229, 238, 215, 0.867);

      border-radius: 25px;

      padding: 45px 35px;

      text-align: center;

      box-shadow: 0 20px 50px rgba(13, 128, 227, 0.763);
    }

    .logo {
      background: #fff;
      border-radius: 50%;
      width: 90px;

      margin-bottom: 20px;
      padding: 5px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 110px;

      font-weight: 800;

      background: linear-gradient(135deg, #e1caf7, #d1efff);

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      line-height: 1;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin-top: 10px;

      font-size: 32px;

      color: #fff;
      font-weight: 700;
    }

    p {
      margin: 20px 0;

      font-size: 17px;

      line-height: 1.7;

      color: #eef5ff;
    }

    .icon {
      font-size: 70px;

      color: #ffca28;

      margin: 20px 0;

      animation: float 2.5s infinite ease-in-out;
    }

    .btn {
      display: inline-flex;

      align-items: center;

      gap: 10px;

      padding: 14px 30px;

      border-radius: 50px;

      text-decoration: none;

      background: linear-gradient(135deg, #8a2be2, #4169e1);

      color: #fff;

      font-weight: 700;

      transition: 0.3s;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-4px);

      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .helpful-links {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .helpful-links h3 {
      color: #fff;
      font-size: 18px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .helpful-links ul {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .helpful-links a {
      color: #eef5ff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      transition: background 0.3s, color 0.3s;
    }

    .helpful-links a:hover {
      background: #fff;
      color: #1a1a2e;
    }

    @keyframes float {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }

      100% {
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 35px 25px;
      }
      h1 {
        font-size: 90px;
      }

      h2 {
        font-size: 26px;
      }

      p {
        font-size: 15px;
      }
      .helpful-links a {
        font-size: 12px;
        padding: 3px 8px;
      }
    }
  </style>
  <body>
    <div class="container">
      <div class="card">
        <img
          src="https://pub-0ea4b0b9de9b4d6db5c369669418e7ef.r2.dev/logo/sun-shine-club-logo.png"
          class="logo"
          alt="Sun Shine Club"
        />

        <h1>404</h1>

        <h2>Oops! Page Not Found</h2>

        <p>
          The page you are looking for might have been removed, had its name
          changed, or is temporarily unavailable.
        </p>

        <div class="icon">
          <i class="fa-solid fa-compass-drafting"></i>
        </div>

        <a href="index.html" class="btn">
          <i class="fa-solid fa-house"></i>

          Back to Home
        </a>

        <div class="helpful-links">
          <h3>Here are some helpful links:</h3>
          <ul>
            <li><a href="/pages/about.html">About Us</a></li>
            <li><a href="/pages/events.html">Events</a></li>
            <li><a href="/pages/gallery.html">Gallery</a></li>
            <li><a href="/pages/contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
