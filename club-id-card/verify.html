<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Member Verification | Sun Shine Club</title>

    <link rel="stylesheet" href="css/verify.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="verify-container">

    <div id="verifyCard" class="verify-card">

        <!-- Search Screen -->
        <div id="searchSection">

            <img src="https://pub-0ea4b0b9de9b4d6db5c369669418e7ef.r2.dev/logo/sun-shine-club-logo.png" class="club-logo" alt="Sun Shine Club">

            <h2>Member Verification</h2>

            <p>
                Enter your Member ID below or scan the QR code
                printed on your membership card.
            </p>

            <div class="search-form">

                <input
                    type="text"
                    id="memberId"
                    placeholder="Enter Member ID (e.g. SSC018)"
                    autocomplete="off">

                <button id="verifyBtn">
                    <i class="fa-solid fa-circle-check"></i>
                    Verify Member
                </button>

            </div>

            <div class="scan-note">

                <i class="fa-solid fa-qrcode"></i>

                <span>Scan the QR code for instant verification.</span>

            </div>

        </div>

        <!-- Verification Result -->
        <div id="resultSection" style="display:none;">

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <h2>Verifying Member...</h2>

            </div>

        </div>

    </div>

</div>

<script src="js/verify.js"></script>

</body>

</html>
