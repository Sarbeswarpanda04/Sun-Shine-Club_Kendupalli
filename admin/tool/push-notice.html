<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Push Notice | Sun Shine Club
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #f5f3fa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #222;
        }

        .container {
            width: min(760px, 100%);

            padding: 30px;

            border-radius: 18px;

            background: #fff;

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, .08);
        }

        h1 {
            margin: 0 0 5px;

            font-size: 25px;
        }

        .subtitle {
            margin: 0 0 25px;

            color: #777;

            font-size: 13px;
        }

        .auth-box {
            padding: 15px;

            margin-bottom: 20px;

            border-radius: 10px;

            background: #f7f5fc;
        }

        .auth-box strong {
            display: block;

            margin-bottom: 5px;

            font-size: 13px;
        }

        #authStatus {
            color: #777;

            font-size: 12px;
        }

        button {
            border: 0;

            border-radius: 9px;

            padding: 12px 18px;

            background: #3d0cb8;

            color: #fff;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #31099a;
        }

        button:disabled {
            opacity: .55;

            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 600;

            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 11px 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-family: inherit;

            font-size: 13px;
        }

        textarea {
            min-height: 100px;

            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #3d0cb8;

            box-shadow:
                0 0 0 3px
                rgba(61, 12, 184, .08);
        }

        .section-title {
            margin: 25px 0 15px;

            padding-bottom: 8px;

            border-bottom: 1px solid #eee;

            color: #3d0cb8;

            font-size: 14px;

            font-weight: 700;
        }

        .grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .checkboxes {
            display: flex;

            gap: 20px;

            margin: 10px 0 20px;
        }

        .checkbox {
            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 12px;

            cursor: pointer;
        }

        .checkbox input {
            width: auto;
        }

        .actions {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 25px;
        }

        .result {
            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            white-space: pre-wrap;

            font-family: monospace;

            font-size: 12px;

            line-height: 1.6;

            background: #f5f5f5;
        }

        .success {
            background: #edf8f0;

            color: #176b30;
        }

        .error {
            background: #fff0ef;

            color: #b42318;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .checkboxes {
                flex-direction: column;

                gap: 10px;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        Push Notice to Firebase
    </h1>

    <p class="subtitle">
        Sun Shine Club Kendupalli — Firestore Notice Importer
    </p>


    <!-- =====================================================
         AUTH
    ====================================================== -->

    <div class="auth-box">

        <strong>
            Administrator Authentication
        </strong>

        <span id="authStatus">
            Not signed in
        </span>

        <div style="margin-top:12px;">

            <button
                type="button"
                id="loginButton"
            >
                Sign in with Google
            </button>

        </div>

    </div>


    <!-- =====================================================
         NOTICE FORM
    ====================================================== -->

    <form id="noticeForm">


        <div class="section-title">
            Notice Information
        </div>


        <div class="form-group">

            <label for="noticeId">
                Notice ID
            </label>

            <input
                type="text"
                id="noticeId"
                value="notice-001"
                required
            >

        </div>


        <!-- =================================================
             ENGLISH
        ================================================== -->

        <div class="section-title">
            English Content
        </div>


        <div class="form-group">

            <label for="titleEn">
                Title
            </label>

            <input
                type="text"
                id="titleEn"
                value="Ganesh Puja 2026"
                required
            >

        </div>


        <div class="form-group">

            <label for="descriptionEn">
                Description
            </label>

            <textarea id="descriptionEn">Join Sun Shine Club, Kendupalli for the Ganesh Puja celebration on 14 September 2026.</textarea>

        </div>


        <div class="form-group">

            <label for="contentEn">
                Content
            </label>

            <textarea id="contentEn">Sun Shine Club, Kendupalli is pleased to announce the Ganesh Puja celebration on 14 September 2026. Members, families and local residents are invited to participate in the celebration and seek the blessings of Lord Ganesha. Everyone is warmly invited to join the celebration and make the occasion memorable.</textarea>

        </div>


        <!-- =================================================
             ODIA
        ================================================== -->

        <div class="section-title">
            Odia Content
        </div>


        <div class="form-group">

            <label for="titleOr">
                ଶୀର୍ଷକ
            </label>

            <input
                type="text"
                id="titleOr"
                value="ଗଣେଶ ପୂଜା ୨୦୨୬"
            >

        </div>


        <div class="form-group">

            <label for="descriptionOr">
                ସଂକ୍ଷିପ୍ତ ବିବରଣୀ
            </label>

            <textarea id="descriptionOr">୧୪ ସେପ୍ଟେମ୍ବର ୨୦୨୬ରେ ସନ୍ ସାଇନ୍ କ୍ଲବ୍, କେନ୍ଦୁପଲ୍ଲୀର ଗଣେଶ ପୂଜା ପାଳନରେ ଯୋଗ ଦିଅନ୍ତୁ।</textarea>

        </div>


        <div class="form-group">

            <label for="contentOr">
                ବିଷୟବସ୍ତୁ
            </label>

            <textarea id="contentOr">ସନ୍ ସାଇନ୍ କ୍ଲବ୍, କେନ୍ଦୁପଲ୍ଲୀ ପକ୍ଷରୁ ୧୪ ସେପ୍ଟେମ୍ବର ୨୦୨୬ରେ ଗଣେଶ ପୂଜା ପାଳନ ଆୟୋଜନ କରାଯାଉଛି। ସଦସ୍ୟ, ପରିବାର ଏବଂ ସ୍ଥାନୀୟ ବାସିନ୍ଦାମାନଙ୍କୁ ଏହି ପବିତ୍ର ଉତ୍ସବରେ ଯୋଗଦେଇ ପ୍ରଭୁ ଗଣେଶଙ୍କ ଆଶୀର୍ବାଦ ନେବା ପାଇଁ ଆମନ୍ତ୍ରଣ କରାଯାଉଛି। ସମସ୍ତେ ଏହି ଉତ୍ସବରେ ଯୋଗଦେଇ ଏହାକୁ ସ୍ମରଣୀୟ କରନ୍ତୁ।</textarea>

        </div>


        <!-- =================================================
             EVENT DETAILS
        ================================================== -->

        <div class="section-title">
            Event Details
        </div>


        <div class="grid">


            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    value="2026-09-14"
                    required
                >

            </div>


            <div class="form-group">

                <label for="time">
                    Time
                </label>

                <input
                    type="text"
                    id="time"
                    value="08:00 AM"
                >

            </div>


        </div>


        <div class="grid">


            <div class="form-group">

                <label for="venueEn">
                    Venue — English
                </label>

                <input
                    type="text"
                    id="venueEn"
                    value="Sun Shine Club, Kendupalli"
                >

            </div>


            <div class="form-group">

                <label for="venueOr">
                    Venue — Odia
                </label>

                <input
                    type="text"
                    id="venueOr"
                    value="ସନ୍ ସାଇନ୍ କ୍ଲବ୍, କେନ୍ଦୁପଲ୍ଲୀ"
                >

            </div>


        </div>


        <div class="grid">


            <div class="form-group">

                <label for="organizerEn">
                    Organizer — English
                </label>

                <input
                    type="text"
                    id="organizerEn"
                    value="Sun Shine Club, Kendupalli"
                >

            </div>


            <div class="form-group">

                <label for="organizerOr">
                    Organizer — Odia
                </label>

                <input
                    type="text"
                    id="organizerOr"
                    value="ସନ୍ ସାଇନ୍ କ୍ଲବ୍, କେନ୍ଦୁପଲ୍ଲୀ"
                >

            </div>


        </div>


        <!-- =================================================
             PUBLISHING
        ================================================== -->

        <div class="section-title">
            Publishing
        </div>


        <div class="grid">


            <div class="form-group">

                <label for="publishedAt">
                    Published Date
                </label>

                <input
                    type="date"
                    id="publishedAt"
                    value="2026-08-29"
                    required
                >

            </div>


            <div class="form-group">

                <label for="expiresAt">
                    Expiry Date
                </label>

                <input
                    type="date"
                    id="expiresAt"
                    value="2026-09-15"
                >

            </div>


        </div>


        <div class="form-group">

            <label for="image">
                Image URL
            </label>

            <input
                type="url"
                id="image"
                value="https://sunshineclubkendupalli.in/assets/images/notices/ganesh-puja-2026.jpg"
            >

        </div>


        <div class="form-group">

            <label for="link">
                Notice Page URL
            </label>

            <input
                type="url"
                id="link"
                value="https://sunshineclubkendupalli.in/pages/notices/ganesh-puja-2026.html"
            >

        </div>


        <div class="grid">


            <div class="form-group">

                <label for="language">
                    Primary Language
                </label>

                <select id="language">

                    <option value="en">
                        English
                    </option>

                    <option value="or">
                        Odia
                    </option>

                </select>

            </div>


        </div>


        <div class="checkboxes">


            <label class="checkbox">

                <input
                    type="checkbox"
                    id="pinned"
                    checked
                >

                Pinned

            </label>


            <label class="checkbox">

                <input
                    type="checkbox"
                    id="important"
                    checked
                >

                Important

            </label>


        </div>


        <!-- =================================================
             ACTION
        ================================================== -->

        <div class="actions">

            <button
                type="submit"
                id="pushButton"
                disabled
            >
                Push Notice to Firestore
            </button>

        </div>


    </form>


    <!-- =====================================================
         RESULT
    ====================================================== -->

    <div
        id="result"
        class="result hidden"
    ></div>


</div>


<!-- =========================================================
     FIREBASE
========================================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        doc,
        getDoc,
        setDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =====================================================
       FIREBASE CONFIG

       IMPORTANT:
       Replace these values with the same Firebase config
       used by your existing website.
    ====================================================== */

const firebaseConfig = {

    apiKey: "AIzaSyBMBD3UTkZ68RUn5OEQoDv2pW3vxA597PY",

    authDomain:
        "sun-shine-club-537fe.firebaseapp.com",

    projectId:
        "sun-shine-club-537fe",

    storageBucket:
        "sun-shine-club-537fe.firebasestorage.app",

    messagingSenderId:
        "956993375783",

    appId:
        "1:956993375783:web:65825571a8355650a44802"

};


    /* =====================================================
       INITIALIZE FIREBASE
    ====================================================== */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    const provider =
        new GoogleAuthProvider();


    provider.setCustomParameters({
        prompt: "select_account"
    });


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const authStatus =
        document.getElementById(
            "authStatus"
        );


    const pushButton =
        document.getElementById(
            "pushButton"
        );


    const noticeForm =
        document.getElementById(
            "noticeForm"
        );


    const result =
        document.getElementById(
            "result"
        );


    /* =====================================================
       STATE
    ====================================================== */

    let currentUser = null;

    let isAdmin = false;


    /* =====================================================
       RESULT
    ====================================================== */

    function showResult(
        message,
        type = ""
    ) {

        result.textContent =
            message;

        result.className =
            "result " + type;

    }


    /* =====================================================
       CHECK ADMIN
    ====================================================== */

    async function checkAdmin(
        user
    ) {

        if (!user) {

            isAdmin = false;

            return false;

        }


        const adminRef =
            doc(
                db,
                "admins",
                user.uid
            );


        const adminSnapshot =
            await getDoc(
                adminRef
            );


        if (
            adminSnapshot.exists()
        ) {

            isAdmin = true;

            return true;

        }


        isAdmin = false;

        return false;

    }


    /* =====================================================
       GOOGLE LOGIN
    ====================================================== */

    loginButton.addEventListener(
        "click",
        async () => {

            loginButton.disabled =
                true;

            authStatus.textContent =
                "Signing in...";


            try {

                const result =
                    await signInWithPopup(
                        auth,
                        provider
                    );


                const user =
                    result.user;


                const admin =
                    await checkAdmin(
                        user
                    );


                if (!admin) {

                    authStatus.textContent =
                        "Access denied.";

                    pushButton.disabled =
                        true;


                    showResult(
                        "This Google account is authenticated but is not authorized as an administrator.\n\n" +
                        "UID: " +
                        user.uid +
                        "\n" +
                        "Email: " +
                        user.email,
                        "error"
                    );

                    return;

                }


                authStatus.textContent =
                    user.email +
                    " — Administrator";


                pushButton.disabled =
                    false;


                loginButton.textContent =
                    "Signed in";


                showResult(
                    "Administrator authenticated successfully.\n\n" +
                    "UID: " +
                    user.uid +
                    "\n" +
                    "Email: " +
                    user.email
                );


            } catch (error) {

                console.error(
                    "Google login error:",
                    error
                );


                authStatus.textContent =
                    "Authentication failed.";


                showResult(
                    error.message,
                    "error"
                );

            } finally {

                loginButton.disabled =
                    false;

            }

        }
    );


    /* =====================================================
       AUTH STATE
    ====================================================== */

    onAuthStateChanged(
        auth,
        async user => {

            if (!user) {

                currentUser = null;

                isAdmin = false;

                authStatus.textContent =
                    "Not signed in.";

                pushButton.disabled =
                    true;

                return;

            }


            currentUser =
                user;


            try {

                const admin =
                    await checkAdmin(
                        user
                    );


                if (admin) {

                    authStatus.textContent =
                        user.email +
                        " — Administrator";

                    pushButton.disabled =
                        false;

                    loginButton.textContent =
                        "Signed in";

                } else {

                    authStatus.textContent =
                        "Authenticated but not an administrator.";

                    pushButton.disabled =
                        true;

                }

            } catch (error) {

                console.error(
                    "Admin check error:",
                    error
                );

                pushButton.disabled =
                    true;

            }

        }
    );


    /* =====================================================
       PUSH NOTICE
    ====================================================== */

    noticeForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            if (!currentUser) {

                showResult(
                    "Please sign in with your administrator account first.",
                    "error"
                );

                return;

            }


            if (!isAdmin) {

                showResult(
                    "You are not authorized to push notices.",
                    "error"
                );

                return;

            }


            const noticeId =
                document.getElementById(
                    "noticeId"
                ).value.trim();


            if (!noticeId) {

                showResult(
                    "Notice ID is required.",
                    "error"
                );

                return;

            }


            const notice = {

                id: noticeId,


                title: {

                    en:
                        document.getElementById(
                            "titleEn"
                        ).value.trim(),

                    or:
                        document.getElementById(
                            "titleOr"
                        ).value.trim()

                },


                description: {

                    en:
                        document.getElementById(
                            "descriptionEn"
                        ).value.trim(),

                    or:
                        document.getElementById(
                            "descriptionOr"
                        ).value.trim()

                },


                content: {

                    en:
                        document.getElementById(
                            "contentEn"
                        ).value.trim(),

                    or:
                        document.getElementById(
                            "contentOr"
                        ).value.trim()

                },


                date:
                    document.getElementById(
                        "date"
                    ).value,


                time:
                    document.getElementById(
                        "time"
                    ).value.trim(),


                venue: {

                    en:
                        document.getElementById(
                            "venueEn"
                        ).value.trim(),

                    or:
                        document.getElementById(
                            "venueOr"
                        ).value.trim()

                },


                organizer: {

                    en:
                        document.getElementById(
                            "organizerEn"
                        ).value.trim(),

                    or:
                        document.getElementById(
                            "organizerOr"
                        ).value.trim()

                },


                image:
                    document.getElementById(
                        "image"
                    ).value.trim(),


                publishedAt:
                    document.getElementById(
                        "publishedAt"
                    ).value,


                expiresAt:
                    document.getElementById(
                        "expiresAt"
                    ).value,


                pinned:
                    document.getElementById(
                        "pinned"
                    ).checked,


                important:
                    document.getElementById(
                        "important"
                    ).checked,


                language:
                    document.getElementById(
                        "language"
                    ).value,


                link:
                    document.getElementById(
                        "link"
                    ).value.trim()

            };


            pushButton.disabled =
                true;


            pushButton.textContent =
                "Checking notice...";


            try {

                const noticeRef =
                    doc(
                        db,
                        "notices",
                        noticeId
                    );


                /* =========================================
                   PREVENT ACCIDENTAL OVERWRITE
                ========================================== */

                const existing =
                    await getDoc(
                        noticeRef
                    );


                if (
                    existing.exists()
                ) {

                    const overwrite =
                        confirm(
                            "A notice with ID \"" +
                            noticeId +
                            "\" already exists.\n\n" +
                            "Do you want to overwrite it?"
                        );


                    if (!overwrite) {

                        showResult(
                            "Operation cancelled. Existing notice was not changed."
                        );

                        return;

                    }

                }


                pushButton.textContent =
                    "Pushing to Firestore...";


                await setDoc(
                    noticeRef,
                    notice
                );


                showResult(
                    "NOTICE PUSHED SUCCESSFULLY\n\n" +

                    "Collection: notices\n" +

                    "Document ID: " +
                    noticeId +

                    "\n\n" +

                    "Title: " +
                    notice.title.en +

                    "\n" +

                    "Date: " +
                    notice.date +

                    "\n\n" +

                    "The notice is now stored in Firestore.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "Firestore error:",
                    error
                );


                showResult(
                    "FAILED TO PUSH NOTICE\n\n" +

                    error.code +

                    "\n\n" +

                    error.message,
                    "error"
                );

            } finally {

                pushButton.disabled =
                    false;

                pushButton.textContent =
                    "Push Notice to Firestore";

            }

        }
    );

</script>


</body>

</html>
