<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        Admin Login | Sun Shine Club Kendupalli
    </title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>

    <main class="admin-login-page">

        <section class="login-card">

            <div class="club-logo">

                <img
                    src="https://pub-0ea4b0b9de9b4d6db5c369669418e7ef.r2.dev/logo/sun-shine-club-logo.png"
                    alt="Sun Shine Club Kendupalli"
                >

            </div>


            <div class="login-heading">

                <p class="login-label">
                    ADMIN PANEL
                </p>

                <h1>
                    Sun Shine Club
                </h1>

                <p>
                    Kendupalli
                </p>

            </div>


            <div
                id="loginError"
                class="login-error"
                role="alert"
                hidden
            ></div>


            <button
                type="button"
                id="googleLogin"
                class="google-login-button"
            >

                <span class="google-icon">
                    G
                </span>

                <span id="googleLoginText">
                    Continue with Google
                </span>

                <span
                    id="loginSpinner"
                    class="login-spinner"
                    hidden
                ></span>

            </button>


            <p class="login-footer">

                Authorized administrators only

            </p>

        </section>

    </main>


    <script
        type="module"
        src="js/admin-login.js"
    ></script>

</body>

</html>
